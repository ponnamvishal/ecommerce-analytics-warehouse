version: 2

models:
  - name: stg_customers
    description: >
      Cleaned customer records from the raw Olist customer dataset.
      Standardizes city and state formatting while preserving customer identifiers.

    columns:
      - name: customer_id
        description: Unique identifier for a customer record.
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: Unique identifier representing the customer across orders.
        tests:
          - not_null

      - name: customer_zip_code_prefix
        description: Customer postal-code prefix.

      - name: customer_city
        description: Customer city standardized to lowercase and trimmed.

      - name: customer_state
        description: Customer state standardized to uppercase.

  - name: stg_orders
    description: >
      Cleaned order-level records containing order status, customer reference,
      purchase timestamps, approval information, and delivery dates.

    columns:
      - name: order_id
        description: Unique identifier of the order.
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Identifier of the customer who placed the order.
        tests:
          - not_null

      - name: order_status
        description: Current status of the order.
        tests:
          - not_null

      - name: order_purchase_timestamp
        description: Timestamp when the order was placed.

      - name: order_approved_at
        description: Timestamp when the order payment was approved.

      - name: order_delivered_carrier_date
        description: Date when the order was handed to the carrier.

      - name: order_delivered_customer_date
        description: Date when the order was delivered to the customer.

      - name: order_estimated_delivery_date
        description: Estimated delivery date for the order.

  - name: stg_order_items
    description: >
      Cleaned order-item level records containing product, seller,
      pricing, freight, and shipping information.

    columns:
      - name: order_id
        description: Identifier of the order containing the item.
        tests:
          - not_null

      - name: order_item_id
        description: Sequential identifier of the item within an order.
        tests:
          - not_null

      - name: product_id
        description: Identifier of the product.
        tests:
          - not_null

      - name: seller_id
        description: Identifier of the seller.
        tests:
          - not_null

      - name: shipping_limit_date
        description: Deadline associated with shipment handling.

      - name: price
        description: Product price for the order item.
        tests:
          - not_null

      - name: freight_value
        description: Freight value associated with the order item.
        tests:
          - not_null

  - name: stg_order_payments
    description: >
      Cleaned payment-level records containing payment method,
      installment information, and payment value.

    columns:
      - name: order_id
        description: Identifier of the associated order.
        tests:
          - not_null

      - name: payment_sequential
        description: Sequential number identifying the payment record within an order.
        tests:
          - not_null

      - name: payment_type
        description: Payment method used for the transaction.
        tests:
          - not_null

      - name: payment_installments
        description: Number of installments used for the payment.

      - name: payment_value
        description: Monetary value of the payment.
        tests:
          - not_null

  - name: stg_reviews
    description: >
      Cleaned customer review records containing review scores,
      comments, and review timestamps.

    columns:
      - name: review_id
        description: Identifier of the review.
        tests:
          - not_null

      - name: order_id
        description: Identifier of the order associated with the review.
        tests:
          - not_null

      - name: review_score
        description: Customer review score.
        tests:
          - not_null

      - name: review_comment_title
        description: Customer-provided review title.

      - name: review_comment_message
        description: Customer-provided review message.

      - name: review_creation_date
        description: Timestamp when the review was created.

      - name: review_answer_timestamp
        description: Timestamp when the review received a response.

  - name: stg_products
    description: >
      Cleaned product records containing category, descriptive,
      photographic, and physical product attributes.

    columns:
      - name: product_id
        description: Unique identifier of the product.
        tests:
          - not_null
          - unique

      - name: product_category_name
        description: Product category name standardized to lowercase.

      - name: product_name_length
        description: Length of the product name.

      - name: product_description_length
        description: Length of the product description.

      - name: product_photos_qty
        description: Number of photos associated with the product.

      - name: product_weight_g
        description: Product weight in grams.

      - name: product_length_cm
        description: Product length in centimeters.

      - name: product_height_cm
        description: Product height in centimeters.

      - name: product_width_cm
        description: Product width in centimeters.

  - name: stg_sellers
    description: >
      Cleaned seller records containing seller identifiers,
      geographic information, and postal-code prefixes.

    columns:
      - name: seller_id
        description: Unique identifier of the seller.
        tests:
          - not_null
          - unique

      - name: seller_zip_code_prefix
        description: Seller postal-code prefix.

      - name: seller_city
        description: Seller city standardized to lowercase.

      - name: seller_state
        description: Seller state standardized to uppercase.

  - name: stg_geolocation
    description: >
      Cleaned geographic observations containing postal-code prefixes,
      latitude, longitude, city, and state.

    columns:
      - name: zip_code_prefix
        description: Postal-code prefix associated with the geographic observation.
        tests:
          - not_null

      - name: latitude
        description: Geographic latitude.

      - name: longitude
        description: Geographic longitude.

      - name: city
        description: Geographic city standardized to lowercase.

      - name: state
        description: Geographic state standardized to uppercase.

  - name: stg_category_translation
    description: >
      Lookup table translating product category names into English.

    columns:
      - name: product_category_name
        description: Original product category name.
        tests:
          - not_null
          - unique

      - name: product_category_name_english
        description: English translation of the product category.
        tests:
          - not_null
